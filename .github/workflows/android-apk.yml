
name: MagnetRute Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Android SDK installieren
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests
        run: bash tests/run_tests.sh

      - name: APK bauen
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: MagnetRute_v0.2.0_APK
          path: app/build/outputs/apk/debug/app-debug.apk
